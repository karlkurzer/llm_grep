[project]
name = "llm-grep"
version = "0.1.0"
description = "Pipe any command output through an LLM for intelligent text processing"
readme = "README.md"
authors = [
    { name = "Karl Kurzer", email = "kurzer@amazon.ch" }
]
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.81.13",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.42.50"]

[project.scripts]
llm_grep = "llm_grep.cli:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]
